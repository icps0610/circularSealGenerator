
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>變形印章產生器</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
        }

        :root {
            --print-size: 4cm;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
        }

        /* ===== 外層包裹 ===== */
        .it-wrapper {
            max-width: 860px;
            margin: 24px auto 48px;
            padding: 0 16px;
        }

        /* ===== 標題 ===== */
        .it-title {
            font-size: 22px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== 主面板 ===== */
        .it-panel {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            padding: 24px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ===== 控制區 ===== */
        .it-controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== 預覽區 ===== */
        .it-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-top: 8px;
            border-top: 1px solid #e5e7eb;
        }

        /* ===== 行按鈕群 ===== */
        .it-action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== 設定列 (標籤 + 輸入) ===== */
        .it-setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9fafb;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .it-setting-row label {
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        /* ===== textarea ===== */
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1.1rem;
            font-family: 'Fira Code', monospace;
            background-color: #f9fafb;
            color: #1f2937;
            outline: none;
            resize: vertical;
            min-height: 120px;
            text-align: center;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        textarea:focus {
            background-color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* ===== number input ===== */
        input[type="number"] {
            width: 80px;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #1f2937;
            outline: none;
            background-color: #ffffff;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="number"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* ===== Canvas 預覽框 ===== */
        canvas {
            width: 100%;
            max-width: 360px;
            height: auto;
            aspect-ratio: 1 / 1;
            background-color: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 12px;
            transition: background-color 0.3s;
        }

        /* ===== 按鈕基底 ===== */
        button {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        button:focus { outline: none; }

        /* 主要藍色按鈕 */
        .it-btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
        }

        .it-btn-primary:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.25);
        }

        .it-btn-primary:active {
            background-color: #1e40af;
            transform: translateY(1px);
        }

        /* 次要灰色按鈕 */
        .it-btn-secondary {
            background-color: #f9fafb;
            color: #4b5563;
            border: 1px solid #d1d5db;
            flex: 1 1 auto;
        }

        .it-btn-secondary:hover {
            background-color: #eff6ff;
            border-color: #60a5fa;
            color: #1d4ed8;
        }

        .it-btn-secondary:active {
            background-color: #dbeafe;
            border-color: #3b82f6;
            transform: translateY(1px);
        }

        /* ===== 按鈕列 (預覽區底部) ===== */
        .it-btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        /* ===== RWD ===== */
        @media (max-width: 720px) {
            .it-wrapper { padding: 0 10px; margin: 16px auto 32px; }
            .it-title { font-size: 18px; }
            .it-panel { padding: 18px 14px 24px; }
            textarea { min-height: 90px; }
        }

        /* ===== 列印 ===== */
        @media print {
            body { background-color: #ffffff; }
            .it-wrapper { margin: 0; padding: 1cm; }
            .it-title { display: none !important; }
            .it-panel {
                display: block;
                box-shadow: none;
                border: none;
                padding: 0;
            }
            .it-controls, .it-btn-group { display: none !important; }
            canvas {
                width: var(--print-size) !important;
                height: var(--print-size) !important;
                max-width: none;
                border: none;
                padding: 0;
                background-color: transparent;
            }
        }
    </style>
</head>
<body>

<div class="it-wrapper">
    <div class="it-title">&#128142; 變形印章產生器</div>

    <div class="it-panel">

        <!-- 左欄：控制區 -->
        <div class="it-controls">
            <textarea id="sealText">p3Vn7n
qNHWVi
6M9mre</textarea>

            <div class="it-action-row">
                <button class="it-btn-secondary" id="btnToggleTheme">白底黑字</button>
                <button class="it-btn-secondary" id="btnToggleGrid">小寫: 網格</button>
                <button class="it-btn-secondary" id="btnToggleGridStyle">樣式: 水平</button>
            </div>

            <div class="it-setting-row">
                <label for="inputDiameter">列印直徑（公分）</label>
                <input type="number" id="inputDiameter" value="4" min="1" max="20" step="0.5">
            </div>
        </div>

        <!-- 右欄：預覽區 -->
        <div class="it-preview">
            <canvas id="sealCanvas" width="1200" height="1200"></canvas>
            <div class="it-btn-group">
                <button class="it-btn-primary" id="btnPrint" onclick="window.print()">列印 (4公分)</button>
            </div>
        </div>

    </div>
</div>

<script>
    const canvas = document.getElementById('sealCanvas');
    const ctx = canvas.getContext('2d');
    const input = document.getElementById('sealText');
    const inputDiameter = document.getElementById('inputDiameter');
    const btnToggleTheme = document.getElementById('btnToggleTheme');
    const btnToggleGrid = document.getElementById('btnToggleGrid');
    const btnToggleGridStyle = document.getElementById('btnToggleGridStyle');
    const btnPrint = document.getElementById('btnPrint');
    
    const SIZE = 1200;
    const BORDER_WIDTH = 24; 

    // 狀態變數
    let isDarkTheme = true;
    let useGridForLowercase = false;
    let gridStyleIndex = 0;
    const gridStyles = ['水平', '垂直', '點狀', '十字', '斜線'];

    // 事件監聽
    btnToggleTheme.addEventListener('click', () => {
        isDarkTheme = !isDarkTheme;
        btnToggleTheme.innerText = isDarkTheme ? '黑底白字' : '白底黑字';
        generateWarpedSeal();
    });

    btnToggleGrid.addEventListener('click', () => {
        useGridForLowercase = !useGridForLowercase;
        btnToggleGrid.innerText = useGridForLowercase ? '小寫: 網格' : '小寫: 實心';
        generateWarpedSeal();
    });

    btnToggleGridStyle.addEventListener('click', () => {
        gridStyleIndex = (gridStyleIndex + 1) % gridStyles.length;
        btnToggleGridStyle.innerText = `樣式: ${gridStyles[gridStyleIndex]}`;
        generateWarpedSeal();
    });

    inputDiameter.addEventListener('input', (e) => {
        const val = e.target.value || 4;
        document.documentElement.style.setProperty('--print-size', `${val}cm`);
        btnPrint.innerText = `列印 (${val}公分)`;
    });

    function createGridPattern(context, bgColor, fgColor, styleIdx) {
        const pCanvas = document.createElement('canvas');
        const pSize = 16;
        pCanvas.width = pSize;
        pCanvas.height = pSize;
        const pctx = pCanvas.getContext('2d');
        
        pctx.fillStyle = bgColor;
        pctx.fillRect(0, 0, pSize, pSize);
        
        pctx.strokeStyle = fgColor;
        pctx.fillStyle = fgColor;
        pctx.lineWidth = 2;
        pctx.beginPath();

        switch (styleIdx) {

            case 0: // 水平
                pctx.moveTo(0, pSize / 2); pctx.lineTo(pSize, pSize / 2);
                pctx.stroke();
                break;
            case 1: // 垂直
                pctx.moveTo(pSize / 2, 0); pctx.lineTo(pSize / 2, pSize);
                pctx.stroke();
                break;
            case 2: // 點狀
                pctx.arc(pSize / 2, pSize / 2, 3, 0, 2 * Math.PI);
                pctx.fill();
                break;
            case 3: // 十字
                pctx.moveTo(pSize / 2, 0); pctx.lineTo(pSize / 2, pSize);
                pctx.moveTo(0, pSize / 2); pctx.lineTo(pSize, pSize / 2);
                pctx.stroke();
                break;
            case 4: // 斜線
                pctx.moveTo(0, 0); pctx.lineTo(pSize, pSize);
                pctx.moveTo(pSize, 0); pctx.lineTo(0, pSize);
                pctx.stroke();
                break;
        }

        return context.createPattern(pCanvas, 'repeat');
    }

    function generateWarpedSeal() {
        const text = input.value;
        if (!text.trim()) {
            ctx.clearRect(0, 0, SIZE, SIZE);
            return;
        }

        const bgColor = isDarkTheme ? '#000000' : '#ffffff';
        const fgColor = isDarkTheme ? '#ffffff' : '#000000';

        const lines = text.split('\n');
        const numLines = lines.length;

        const offCanvas = document.createElement('canvas');
        offCanvas.width = SIZE;
        offCanvas.height = SIZE;
        const octx = offCanvas.getContext('2d', { willReadFrequently: true });

        const gridPattern = createGridPattern(octx, bgColor, fgColor, gridStyleIndex);

        octx.fillStyle = bgColor;
        octx.fillRect(0, 0, SIZE, SIZE);

        octx.textBaseline = 'middle';
        octx.lineJoin = 'round';
        
        const rowHeight = SIZE / numLines;
        const baseFontSize = 400;
        
        octx.font = `bold ${baseFontSize}px "Fira Code", monospace`;

        for (let i = 0; i < numLines; i++) {
            const lineText = lines[i];
            if (!lineText) continue;

            const metrics = octx.measureText(lineText);
            const textWidth = metrics.width;
            
            const scaleX = SIZE / textWidth;
            const scaleY = rowHeight / baseFontSize;
            const relativeY = (i * rowHeight) + (rowHeight / 2);

            octx.save();
            octx.translate(SIZE / 2, relativeY);
            octx.scale(scaleX * 0.9, scaleY * 0.9);
            
            octx.textAlign = 'left';
            let currentX = -textWidth / 2;

            for (let j = 0; j < lineText.length; j++) {
                const char = lineText[j];
                const charWidth = octx.measureText(char).width;
                
                if (/[a-z]/.test(char) && useGridForLowercase) {
                    octx.lineWidth = 16;
                    octx.strokeStyle = fgColor;
                    octx.fillStyle = gridPattern;
                    octx.strokeText(char, currentX, 0);
                    octx.fillText(char, currentX, 0);
                } else {
                    octx.fillStyle = fgColor;
                    octx.fillText(char, currentX, 0);
                }
                currentX += charWidth;
            }
            octx.restore();
        }

        const srcImageData = octx.getImageData(0, 0, SIZE, SIZE);
        const srcData = srcImageData.data;
        
        const destImageData = ctx.createImageData(SIZE, SIZE);
        const destData = destImageData.data;

        const R = SIZE / 2;

        for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
                const dx = x - R;
                const dy = y - R;

                if (dx * dx + dy * dy <= R * R) {
                    let sx = dx;
                    let sy = dy;

                    const divisorX = Math.sqrt(R * R - dy * dy);
                    const divisorY = Math.sqrt(R * R - dx * dx);

                    if (divisorX > 0) sx = (dx * R) / divisorX;
                    if (divisorY > 0) sy = (dy * R) / divisorY;

                    let srcX = Math.floor(sx + R);
                    let srcY = Math.floor(sy + R);

                    srcX = Math.max(0, Math.min(SIZE - 1, srcX));
                    srcY = Math.max(0, Math.min(SIZE - 1, srcY));

                    const srcIndex = (srcY * SIZE + srcX) * 4;
                    const destIndex = (y * SIZE + x) * 4;

                    destData[destIndex] = srcData[srcIndex];
                    destData[destIndex + 1] = srcData[srcIndex + 1];
                    destData[destIndex + 2] = srcData[srcIndex + 2];
                    destData[destIndex + 3] = srcData[srcIndex + 3];
                }
            }
        }

        ctx.clearRect(0, 0, SIZE, SIZE);
        ctx.putImageData(destImageData, 0, 0);

        ctx.strokeStyle = '#000000'; // 強制將外框設為黑色
        ctx.lineWidth = BORDER_WIDTH;
        ctx.beginPath();
        ctx.arc(R, R, R - (BORDER_WIDTH / 2), 0, 2 * Math.PI);
        ctx.stroke();
    }

    input.addEventListener('input', generateWarpedSeal);
    
    document.fonts.ready.then(function() {
        generateWarpedSeal();
    });
</script>

</body>
</html>
